name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Test on current Go. Go < 1.23.4 on macOS 15 aborts when a test
          # binary re-executes itself ("dyld: missing LC_UUID"), which the
          # supervisor tests do to get a controllable MCP backend. go.mod still
          # declares 1.22 as the supported minimum.
          go-version: stable
          cache: true
      - name: gofmt
        run: gofmt -l . && test -z "$(gofmt -l .)" 
        shell: bash
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build ./...
